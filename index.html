<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECLAIM — Pradita Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-1:#fff89a; --bg-2:#fff5d8; --bg-deep:#fffcf4;
    --ink:#20122E; --ink-soft:#5B4770; --ink-faint:#9C87AE;
    --surface:#FFFFFF; --surface-soft:#FFF7FB;
    --primary:#FF2E88; --primary-dark:#C90F66; --primary-soft:#FFE1EF;
    --mint:#1FB782; --mint-dark:#128F65; --mint-soft:#DCFBEE;
    --yellow:#FFC93C; --yellow-soft:#FFF3D2;
    --coral:#FF5D5D; --coral-soft:#FFE4E4;
    --line:#F1D9E6;
    --font-display:'Baloo 2', system-ui, sans-serif;
    --font-body:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-mono:'Space Mono', monospace;
    --shadow-card: 0 14px 34px -14px rgba(150, 20, 90, .28);
    --shadow-soft: 0 6px 18px -10px rgba(150, 20, 90, .22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(circle at 18% 8%, #FFC1DD 0%, transparent 42%),
      radial-gradient(circle at 88% 92%, #c9eefe 0%, transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-deep) 100%);
    background-attachment:fixed;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--primary); color:#fff;}
  a{color:inherit;}

  /* ---------- layout shell ---------- */
  .shell{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 60px;
    display:flex;
    gap:26px;
    align-items:flex-start;
  }
  .shell.centered{
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .brandbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    gap:10px;
    padding:14px 20px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:.2px;
    color:var(--ink);
  }
  .brandbar .pill{
    display:flex; align-items:center; gap:9px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.9);
    padding:8px 18px;
    border-radius:999px;
    box-shadow:var(--shadow-soft);
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:280px;
    flex:0 0 280px;
    background:var(--surface);
    border-radius:26px;
    box-shadow:var(--shadow-card);
    padding:26px 22px;
    position:sticky;
    top:80px;
  }
  .brand-mark{
    display:flex; align-items:center; gap:10px; margin-bottom:4px;
  }
  .brand-mark .badge{
    width:42px;height:42px;border-radius:14px;
    background:linear-gradient(145deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;
    font-size:20px; box-shadow:0 6px 14px -6px rgba(201,15,102,.6);
  }
  .brand-mark .word{
    font-family:var(--font-display); font-weight:800; font-size:22px;
    letter-spacing:.3px;
  }
  .brand-sub{
    font-size:12.5px; color:var(--ink-faint); font-weight:600;
    margin:0 0 14px 2px;
  }
  .sync-badge{
    display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
    color:var(--mint-dark); margin:0 0 16px 2px;
  }
  .sync-badge .dot{width:7px;height:7px;border-radius:50%; background:var(--mint); box-shadow:0 0 0 3px var(--mint-soft);}
  .sync-badge.off{color:var(--coral);}
  .sync-badge.off .dot{background:var(--coral); box-shadow:0 0 0 3px var(--coral-soft);}

  .profile-card{
    background:var(--surface-soft);
    border:1px dashed var(--line);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:18px;
    display:flex; align-items:center; gap:12px;
  }
  .profile-card .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--primary-soft); color:var(--primary-dark);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-family:var(--font-display); font-size:15px;
    flex:0 0 auto;
  }
  .profile-card .who{font-size:12.5px; color:var(--ink-faint); font-weight:600; line-height:1.5;}
  .profile-card .who b{color:var(--ink); font-size:14px; display:block;}

  .navlist{display:flex; flex-direction:column; gap:6px; margin-bottom:18px;}
  .navlink{
    display:flex; align-items:center; gap:12px;
    padding:11px 14px; border-radius:13px;
    border:none; background:transparent; text-align:left;
    font-weight:700; font-size:14.5px; color:var(--ink-soft);
    transition:background .15s, color .15s, transform .1s;
  }
  .navlink .ic{font-size:17px; width:20px; text-align:center;}
  .navlink:hover{background:var(--primary-soft); color:var(--primary-dark);}
  .navlink.active{background:var(--primary); color:#fff; box-shadow:var(--shadow-soft);}
  .navlink:active{transform:scale(.98);}

  .stat-strip{display:flex; gap:8px; margin-bottom:18px;}
  .stat-chip{
    flex:1; background:var(--surface-soft); border-radius:12px;
    padding:9px 6px; text-align:center; border:1px solid var(--line);
  }
  .stat-chip .n{font-family:var(--font-display); font-weight:800; font-size:17px; color:var(--primary-dark);}
  .stat-chip .l{font-size:9.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}

  .logout-btn{
    width:100%; padding:11px; border-radius:13px; border:1.5px solid var(--line);
    background:#fff; font-weight:700; font-size:13.5px; color:var(--ink-faint);
  }
  .logout-btn:hover{border-color:var(--coral); color:var(--coral);}

  .main{flex:1; min-width:0;}

  /* ---------- generic card ---------- */
  .panel{
    background:var(--surface);
    border-radius:26px;
    box-shadow:var(--shadow-card);
    padding:32px 34px;
  }
  .panel h1{
    font-family:var(--font-display); font-size:26px; font-weight:800;
    margin:0 0 4px;
  }
  .panel .lede{color:var(--ink-faint); font-size:14.5px; font-weight:600; margin:0 0 26px;}
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--primary-dark); font-weight:700;
    display:inline-block; margin-bottom:8px;
  }

  /* ---------- form elements ---------- */
  .field{margin-bottom:18px;}
  .field label{
    display:block; font-weight:700; font-size:13px; color:var(--ink-soft);
    margin-bottom:7px;
  }
  .field .hint{font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-top:5px;}
  .field .err{font-size:11.5px; color:var(--coral); font-weight:700; margin-top:5px; display:none;}
  .field.invalid .err{display:block;}
  .field.invalid .input{border-color:var(--coral); background:var(--coral-soft);}
  .input, select.input, textarea.input{
    width:100%; padding:13px 15px; border-radius:13px;
    border:1.6px solid var(--line); background:var(--surface-soft);
    font-size:14.5px; color:var(--ink); font-weight:600;
    transition:border-color .15s, background .15s;
  }
  .input:focus, select.input:focus, textarea.input:focus{
    outline:none; border-color:var(--primary); background:#fff;
    box-shadow:0 0 0 4px var(--primary-soft);
  }
  textarea.input{resize:vertical; min-height:78px; font-family:inherit;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

  .cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .cat-opt{
    border:1.8px solid var(--line); background:var(--surface-soft);
    border-radius:14px; padding:12px 10px; text-align:left; cursor:pointer;
  }
  .cat-opt .em{font-size:20px;}
  .cat-opt .lb{display:block; font-weight:800; font-size:12.5px; margin-top:4px;}
  .cat-opt .ex{display:block; font-size:10px; color:var(--ink-faint); font-weight:600; margin-top:2px; line-height:1.3;}
  .cat-opt.sel{border-color:var(--primary); background:var(--primary-soft);}
  .cat-opt.sel .lb{color:var(--primary-dark);}

  .upload-box{
    border:2px dashed var(--line); border-radius:16px; padding:18px;
    text-align:center; background:var(--surface-soft); position:relative;
  }
  .upload-box img{max-height:120px; border-radius:10px; margin-bottom:8px;}
  .upload-box .up-txt{font-size:12.5px; font-weight:700; color:var(--ink-faint);}
  .upload-box input[type=file]{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }

  .secret-box{
    border:1.6px dashed var(--primary); background:var(--primary-soft);
    border-radius:14px; padding:14px 16px;
  }
  .secret-box label{color:var(--primary-dark);}

  .btn{
    font-family:var(--font-display); font-weight:700; font-size:15px;
    border:none; border-radius:14px; padding:14px 22px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .1s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 10px 22px -10px rgba(201,15,102,.65);}
  .btn-mint{background:linear-gradient(135deg,var(--mint),var(--mint-dark)); color:#fff; box-shadow:0 10px 22px -10px rgba(18,143,101,.55);}
  .btn-ghost{background:var(--surface-soft); color:var(--ink-soft); border:1.6px solid var(--line);}
  .btn-coral{background:var(--coral-soft); color:var(--coral);}
  .btn-block{width:100%;}
  .btn-row{display:flex; gap:12px; margin-top:24px;}
  .btn-row .btn{flex:1;}

  /* ---------- home ---------- */
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:8px;}
  .action-card{
    border-radius:20px; padding:22px; text-align:left; border:none;
    display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;
  }
  .action-card .aic{font-size:26px;}
  .action-card .att{font-family:var(--font-display); font-weight:800; font-size:17px;}
  .action-card .ads{font-size:12.5px; font-weight:600; opacity:.85; line-height:1.4;}
  .action-card.lost{background:linear-gradient(150deg,#FFE1EF,#FFC8E0); color:var(--primary-dark);}
  .action-card.found{background:linear-gradient(150deg,var(--mint-soft),#B9F3D8); color:var(--mint-dark);}
  .action-card.browse{background:linear-gradient(150deg,var(--yellow-soft),#FFE6A0); color:#9A6B00;}
  .action-card.history{background:linear-gradient(150deg,#E7E4FF,#D2CCFF); color:#4A3FBF;}
  .action-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-soft);}

  .section-title{
    font-family:var(--font-display); font-weight:800; font-size:16px;
    margin:30px 0 14px; display:flex; align-items:center; gap:8px;
  }

  /* ---------- ticket / tag card (signature element) ---------- */
  .tag-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px;}
  .tag{
    background:var(--surface-soft);
    border:1.6px solid var(--line);
    border-radius:16px;
    padding:16px 16px 14px;
    position:relative;
    cursor:pointer;
    transition:transform .12s, box-shadow .15s, border-color .15s;
  }
  .tag:hover{transform:translateY(-3px); box-shadow:var(--shadow-soft); border-color:var(--primary);}
  .tag::before{
    content:"";
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background:var(--bg-deep);
    border:1.6px solid var(--line);
  }
  .tag .stamp{
    position:absolute; top:10px; right:10px;
    font-family:var(--font-mono); font-size:9.5px; font-weight:700;
    letter-spacing:.5px; text-transform:uppercase;
    padding:3px 8px; border-radius:6px; border:1.5px solid currentColor;
    transform:rotate(6deg);
  }
  .tag .stamp.claimed{color:var(--mint-dark); background:var(--mint-soft);}
  .tag .stamp.open{color:var(--primary-dark); background:var(--primary-soft);}
  .tag .thumb{
    width:100%; height:92px; border-radius:12px; margin-bottom:10px;
    background:var(--primary-soft);
    display:flex; align-items:center; justify-content:center; font-size:34px;
    overflow:hidden;
  }
  .tag .thumb img{width:100%; height:100%; object-fit:cover;}
  .tag .t-name{font-family:var(--font-display); font-weight:700; font-size:14.5px; margin:0 0 3px;}
  .tag .t-meta{font-size:11px; color:var(--ink-faint); font-weight:600; line-height:1.5;}
  .tag .t-cat{
    display:inline-block; margin-top:8px; font-size:10px; font-weight:700;
    padding:3px 9px; border-radius:999px; background:var(--surface);
    border:1px solid var(--line); color:var(--ink-soft);
  }
  .tag .secret-flag{
    display:inline-flex; align-items:center; gap:3px; margin-top:8px; margin-left:6px;
    font-size:10px; font-weight:700; color:var(--primary-dark);
  }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-faint);
  }
  .empty-state .em{font-size:34px; margin-bottom:10px;}
  .empty-state b{display:block; color:var(--ink-soft); font-size:14.5px; margin-bottom:4px;}

  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .chip{
    padding:8px 14px; border-radius:999px; border:1.6px solid var(--line);
    background:var(--surface-soft); font-weight:700; font-size:12.5px; color:var(--ink-soft);
  }
  .chip.sel{background:var(--ink); border-color:var(--ink); color:#fff;}
  .tabs{display:flex; gap:6px; background:var(--surface-soft); padding:5px; border-radius:14px; margin-bottom:20px; width:fit-content;}
  .tab{padding:9px 18px; border:none; background:transparent; border-radius:10px; font-weight:700; font-size:13px; color:var(--ink-faint);}
  .tab.active{background:#fff; color:var(--primary-dark); box-shadow:var(--shadow-soft);}
  .search-input{flex:1;}

  /* ---------- result / detail card ---------- */
  .result-wrap{max-width:460px; margin:0 auto; text-align:center;}
  .result-icon{
    width:64px;height:64px;border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center; font-size:30px;
  }
  .result-icon.ok{background:var(--mint-soft);}
  .result-icon.wait{background:var(--yellow-soft);}
  .detail-card{
    background:var(--surface-soft); border:1.6px solid var(--line); border-radius:20px;
    padding:22px; margin:18px 0; text-align:left;
  }
  .detail-card .d-thumb{
    width:100%; height:170px; border-radius:14px; margin-bottom:14px;
    background:var(--primary-soft); display:flex; align-items:center; justify-content:center;
    font-size:52px; overflow:hidden;
  }
  .detail-card .d-thumb img{width:100%; height:100%; object-fit:cover;}
  .detail-card .d-name{font-family:var(--font-display); font-weight:800; font-size:19px; margin-bottom:6px;}
  .detail-card .d-meta{font-size:12.5px; color:var(--ink-faint); font-weight:600; line-height:1.7;}
  .detail-card .d-quote{
    margin-top:10px; font-style:italic; font-size:13px; color:var(--ink-soft);
    background:#fff; padding:10px 13px; border-radius:10px; border:1px solid var(--line);
  }
  .quest{font-family:var(--font-display); font-weight:700; font-size:14px; margin:6px 0 10px;}

  .pickup-card{
    background:var(--mint-soft); border:1.6px solid var(--mint); border-radius:18px;
    padding:18px; text-align:left; margin:16px 0;
  }
  .pickup-card .pk-title{font-family:var(--font-display); font-weight:800; color:var(--mint-dark); margin-bottom:6px;}
  .pickup-card .pk-id{font-family:var(--font-mono); background:#fff; display:inline-block; padding:4px 10px; border-radius:8px; margin-top:6px;}

  /* ---------- history ---------- */
  .hist-row{
    display:flex; align-items:center; gap:14px; padding:14px 10px;
    border-bottom:1px solid var(--line);
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-row .hem{
    width:38px;height:38px;border-radius:11px; background:var(--mint-soft);
    display:flex;align-items:center;justify-content:center; font-size:17px; flex:0 0 auto;
  }
  .hist-row .hd{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); width:92px; flex:0 0 auto;}
  .hist-row .ht{font-size:13.5px; font-weight:600; color:var(--ink-soft);}
  .hist-row .ht b{color:var(--ink); font-weight:800;}

  /* ---------- login ---------- */
  .login-card{
    width:100%; max-width:420px; background:var(--surface);
    border-radius:28px; box-shadow:var(--shadow-card); padding:38px 34px;
    text-align:center;
  }
  .login-card .badge-lg{
    width:64px;height:64px;border-radius:20px; margin:0 auto 14px;
    background:linear-gradient(145deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center; font-size:30px;
    box-shadow:0 10px 24px -8px rgba(201,15,102,.55);
  }
  .login-card h1{font-family:var(--font-display); font-size:26px; font-weight:800; margin:0 0 4px;}
  .login-card .tag-line{color:var(--ink-faint); font-weight:600; font-size:13.5px; margin-bottom:26px;}
  .login-card .field{text-align:left;}

  .setup-card{
    width:100%; max-width:560px; background:var(--surface);
    border-radius:28px; box-shadow:var(--shadow-card); padding:36px 34px;
  }
  .setup-card h1{font-family:var(--font-display); font-size:22px; font-weight:800; margin:0 0 10px;}
  .setup-card ol{padding-left:20px; font-size:13.5px; line-height:2; color:var(--ink-soft);}
  .setup-card code{background:var(--surface-soft); padding:2px 7px; border-radius:6px; font-family:var(--font-mono); font-size:12px;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:13px 22px; border-radius:14px;
    font-weight:700; font-size:13.5px; box-shadow:0 14px 30px -10px rgba(0,0,0,.4);
    z-index:100; display:flex; align-items:center; gap:9px;
    animation:toastIn .25s ease;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}

  @media (max-width: 880px){
    .shell{flex-direction:column; padding:16px 14px 50px;}
    .sidebar{
      position:relative; top:0; width:100%; flex:none;
      padding:18px; border-radius:22px;
    }
    .navlist{flex-direction:row; flex-wrap:wrap;}
    .navlink{flex:1 1 auto; justify-content:center;}
    .panel{padding:22px 18px; border-radius:22px;}
    .action-grid{grid-template-columns:1fr;}
    .grid-2{grid-template-columns:1fr;}
    .cat-grid{grid-template-columns:repeat(2,1fr);}
    .stat-strip{display:none;}
  }
</style>
</head>
<body>
<div class="brandbar"><div class="pill">🤟👽 <span>RECLAIM — Pradita Lost &amp; Found</span></div></div>
<div id="app"></div>

<!--
  ============================================================
  RECLAIM — single module script.
  Firebase init + all app logic live together here so imports
  (modular SDK) and the rest of the code share the same scope.
  Everything below runs as an ES module — that's required
  because Firebase's modern SDK is import-based, not the old
  global `firebase.xxx()` style.
  ============================================================
-->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc,
  onSnapshot, getDocs, query, limit, writeBatch
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

/* ============================================================
   RECLAIM — CONFIG
   ------------------------------------------------------------
   Paste your real Firebase config below (Project settings ->
   General -> "Your apps" -> Web app -> config snippet).
   This key is meant to be public for web apps — access control
   is enforced by Firestore Security Rules, not by hiding this.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDT24E05fgYqKOOFIKg7ZkUZd6SYXy5R14",
  authDomain: "ia-cs-hl-agnes.firebaseapp.com",
  projectId: "ia-cs-hl-agnes",
  storageBucket: "ia-cs-hl-agnes.firebasestorage.app",
  messagingSenderId: "352389928899",
  appId: "1:352389928899:web:383186e7ca73bf92c88f76",
  measurementId: "G-Z5M5EVMY41"
};

// Student ID format: "25082" prefix shared by everyone, followed by
// each student's roster number (alphabetical order). Adjust the
// {2,4} below if your roster numbers are a different length.
const SCHOOL_ID_PREFIX = "25082";
const SCHOOL_ID_RE = new RegExp("^" + SCHOOL_ID_PREFIX + "\\d{2,4}$");

const CATEGORIES = [
  {id:'electronics', label:'Electronics', emoji:'💻', examples:'MacBook, charger, phone, TWS, headset, modem, flash disk, watch'},

  return d.toLocaleDateString('en-US', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function fmtShort(iso){
  if(!iso) return '—';

async function seedIfEmpty(){
  const q = query(collection(db, 'items'), limit(1));
  const snap = await getDocs(q);
  if(snap.empty){
    const {items, history} = seedData();
    const batch = writeBatch(db);
    items.forEach(it => batch.set(doc(db, 'items', it.id), it));
    history.forEach(h => batch.set(doc(db, 'history', uid()), h));
    await batch.commit();
  }
}

function watchCollections(){
  onSnapshot(collection(db, 'items'), snap => {
    S.items = snap.docs.map(d => ({id:d.id, ...d.data()}));
    S.loaded = true;
    render();
  }, err => { console.error(err); S.syncError = true; render(); });

  onSnapshot(collection(db, 'history'), snap => {
    S.history = snap.docs.map(d => d.data());
    render();
  }, err => console.error(err));
}

/* ============================================================
   Matching logic
   ============================================================ */
function findMatch(report){
  const opposite = report.kind === 'lost' ? 'found' : 'lost';
  const pool = S.items.filter(i => i.kind === opposite && i.status === 'open' && i.category === report.category);
  if(pool.length === 0) return null;
  const target = normalize(report.name);
  let best = null, bestScore = 0;
  for(const cand of pool){
    const cname = normalize(cand.name);
    let score = 0;
    if(cname === target) score = 3;
    else if(cname.includes(target) || target.includes(cname)) score = 2;
    else {
      const tWords = target.split(' ');
      const cWords = cname.split(' ');
      if(tWords.some(w => w.length>2 && cWords.includes(w))) score = 1;
    }
    if(score > bestScore){ bestScore = score; best = cand; }
  }
  return bestScore > 0 ? best : (pool[0] || null);
}

/* ============================================================
   Image handling
   ============================================================ */
function handleImageInput(inputEl, cb){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const max = 420;
      let w = img.width, h = img.height;
      if(w > h && w > max){ h = h*max/w; w = max; }
      else if(h > max){ w = w*max/h; h = max; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  return `
    <span class="eyebrow">${isLost?'Lost report':'Found report'}</span>
    <h1 style="font-size:22px;">${escapeHtml(item.name)}</h1>
    ${detailCard(item)}
    <div class="quest">${isLost?'Have you seen it?':'Is this yours?'}</div>
    <div class="btn-row">
      <button class="btn btn-mint" id="detailYes">✅ Yes</button>
      <button class="btn btn-ghost" data-nav="browse">No, back to browse</button>
    </div>
  `;
}

/* ---------- claim verification ---------- */
function verifyClaimView(){
  const item = S.items.find(i=>i.id===S.selectedId);
  if(!item) return browseView();
  const hasSecret = !!(item.secret && item.secret.trim());
  return `
    <div class="result-wrap">
      <span class="eyebrow">Confirm it's yours</span>
      <h1 style="font-size:21px;">One quick check before we hand it over</h1>
      ${detailCard(item)}
      ${hasSecret ? `
        <div class="field" style="text-align:left;">
          <label>Describe a detail only the real owner would know</label>
          <input class="input" id="secretGuess" placeholder="e.g. a mark, a sticker, what's saved inside…">
          <div class="hint">This is checked against a detail only ${escapeHtml(item.reporterName)} recorded — it's never shown publicly.</div>
          ${S.claimError ? `<div class="err" style="display:block;">${escapeHtml(S.claimError)}</div>` : ''}
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" data-nav="browse">Cancel</button>
          <button class="btn btn-mint" id="confirmClaim">Confirm claim</button>
        </div>
      ` : `
        <p class="lede">No verification detail was set for this item. You can still claim it — an attendant will check your student ID in person before handing it over.</p>
        <div class="btn-row">
          <button class="btn btn-ghost" data-nav="browse">Cancel</button>
          <button class="btn btn-mint" id="confirmClaim">Confirm claim</button>
        </div>
      `}
    </div>
  `;
}

function claimSuccessView(){
  const item = S.items.find(i=>i.id===S.selectedId);
  if(!item) return homeView();
  return `
    <div class="result-wrap">
      <div class="result-icon ok">🎉</div>
      <span class="eyebrow">Claim confirmed</span>
      <h1 style="font-size:21px;">You're all set, ${firstName()}!</h1>
      <div class="pickup-card">
        <div class="pk-title">📍 Pickup instructions</div>
        Bring your student ID to the Lost &amp; Found desk to collect <b>${escapeHtml(item.name)}</b>.
        <div class="pk-id">${escapeHtml(S.user.studentId)}</div>
      </div>
      <button class="btn btn-primary btn-block" data-nav="home">Back to home page</button>
    </div>
  `;
}

/* ---------- history ---------- */
function historyView(){
  const rows = [...S.history].sort((a,b)=>b.date.localeCompare(a.date));
  return `
    <span class="eyebrow">History</span>
    <h1>Reclaimed items</h1>
    <p class="lede">A log of everything successfully returned to its owner. Items are stored for one month after being found.</p>
    ${rows.length ? rows.map(h=>`
      <div class="hist-row">
        <div class="hem">✅</div>
        <div class="hd">${fmtShort(h.date)}</div>
        <div class="ht"><b>${escapeHtml(h.name)}</b> ${h.action} <b>${escapeHtml(h.item)}</b></div>
      </div>
    `).join('') : `<div class="empty-state"><div class="em">🗂️</div><b>No history yet</b>Reclaimed items will show up here.</div>`}
  `;
}

/* ---------- shared bits ---------- */
function tagCard(item){
  const stampClass = item.status==='claimed' ? 'claimed' : 'open';
  const stampText = item.status==='claimed' ? 'Completed' : (item.kind==='lost'?'Wanted':'Waiting');
  const thumb = item.image ? `<img src="${item.image}">` : emojiFor(item);
  const secretFlag = (item.kind==='found' && item.secret && item.secret.trim()) ? `<span class="secret-flag">🔒 Verified claim</span>` : '';
  return `
    <div class="tag" data-open="${item.id}">
      <div class="stamp ${stampClass}">${stampText}</div>
      <div class="thumb">${thumb}</div>
      <div class="t-name">${escapeHtml(item.name)}</div>
      <div class="t-meta">${item.kind==='lost'?'Last seen':'Found'} ${escapeHtml(item.location)}<br>${fmtShort(item.date)}</div>
      <span class="t-cat">${catLabel(item.category)}</span>${secretFlag}
    </div>`;
}
function detailCard(item){
  const thumb = item.image ? `<img src="${item.image}">` : emojiFor(item);
  return `
    <div class="detail-card">
      <div class="d-thumb">${thumb}</div>
      <div class="d-name">${escapeHtml(item.name)}</div>
      <div class="d-meta">
        ${item.kind==='lost' ? 'Reported by' : 'Found by'} <b>${escapeHtml(item.reporterName)}</b><br>
        ${item.kind==='lost'?'Last seen in':'Found in'} <b>${escapeHtml(item.location)}</b> · ${fmtDate(item.date)}
      </div>
      ${item.details ? `<div class="d-quote">"${escapeHtml(item.details)}"</div>` : ''}
    </div>`;
}
function catLabel(id){ const c = CATEGORIES.find(c=>c.id===id); return c ? c.emoji+' '+c.label : id; }
function firstName(){ return escapeHtml((S.user.name||'').split(' ')[0]); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ============================================================
   Event wiring
   ============================================================ */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = () => go(el.getAttribute('data-nav'));
  });
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = () => { S.user = null; S.view = 'login'; render(); };

  /* category picker */
  const catGrid = document.getElementById('catGrid');
  if(catGrid){
    catGrid.querySelectorAll('.cat-opt').forEach(btn=>{
      btn.onclick = () => {
        catGrid.querySelectorAll('.cat-opt').forEach(b=>b.classList.remove('sel'));
        btn.classList.add('sel');
        catGrid.dataset.selected = btn.getAttribute('data-cat');
      };
    });
  }

  /* image upload preview */
  const fImage = document.getElementById('f_image');
  if(fImage){
    fImage.onchange = () => {
      handleImageInput(fImage, (dataUrl) => {
        S.pendingImage = dataUrl;
        document.getElementById('uploadTxt').outerHTML = `<img src="${dataUrl}"><div class="up-txt" id="uploadTxt">✅ Photo attached — tap to change</div>`;
      });
    };
  }

  /* submit report */
  const submitBtn = document.getElementById('submitReport');
  if(submitBtn){
    submitBtn.onclick = async () => {
      const kind = submitBtn.getAttribute('data-kind');
      const cat = document.getElementById('catGrid').dataset.selected;
      const name = document.getElementById('f_name').value.trim();
      const where = document.getElementById('f_where').value.trim();
      const when = document.getElementById('f_when').value;
      const detail = document.getElementById('f_detail').value.trim();
      const secretEl = document.getElementById('f_secret');
      const secret = secretEl ? secretEl.value.trim() : '';
      if(!cat || !name || !where){
        showToast('Please fill in category, item name, and location', '⚠️');
        return;
      }
      submitBtn.disabled = true;
      const item = {
        id: uid(), kind, category: cat, name, location: where, date: when || todayISO(),
        details: detail, secret: secret, image: S.pendingImage || null,
        reporterName: S.user.name, reporterId: S.user.studentId,
        status: 'open', createdAt: todayISO(),
      };
      const match = kind === 'lost' ? findMatch(item) : null;
      try{
        await addItemDoc(item);
      }catch(e){
        console.error(e);
        showToast("Couldn't save — check your Firestore rules / connection", '⚠️');
        submitBtn.disabled = false;
        return;
      }
      S.pendingImage = null;

      if(kind === 'lost'){
        if(match){ go('lostResultMatch', {matchId: match.id, selectedId: item.id}); }
        else { go('lostResultNone'); }
      } else {
        go('foundResult', {selectedId: item.id});
      }
    };
  }

  /* match yes -> verification step (found item is S.matchId) */
  const matchYes = document.getElementById('matchYes');
  if(matchYes){
    matchYes.onclick = () => go('verifyClaim', {selectedId: S.matchId, lostContextId: S.selectedId});
  }
  const matchNo = document.getElementById('matchNo');
  if(matchNo) matchNo.onclick = () => go('lostResultNone');

  /* browse tabs / filters */
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = () => { S.browseTab = el.getAttribute('data-tab'); S.browseCat='all'; S.browseQuery=''; render(); };
  });
  document.querySelectorAll('[data-catf]').forEach(el=>{
    el.onclick = () => { S.browseCat = el.getAttribute('data-catf'); render(); };
  });
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.oninput = () => { S.browseQuery = searchInput.value; render(); const el=document.getElementById('searchInput'); if(el){el.focus(); el.selectionStart=el.selectionEnd=el.value.length;} };
  }

  /* open item detail */
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = () => go('itemDetail', {selectedId: el.getAttribute('data-open')});
  });

  /* detail yes -> if found item, go to verification; if lost item, just say thanks and let finder submit a found report */
  const detailYes = document.getElementById('detailYes');
  if(detailYes){
    detailYes.onclick = () => {
      const item = S.items.find(i=>i.id===S.selectedId);
      if(!item) return;
      if(item.kind === 'found'){
        go('verifyClaim', {selectedId: item.id, lostContextId: null});
      } else {
        showToast('Thanks — please submit a Found report so we can connect it!', '🙏');
        go('reportFound');
      }
    };
  }

  /* confirm claim after verification */
  const confirmClaim = document.getElementById('confirmClaim');
  if(confirmClaim){
    confirmClaim.onclick = async () => {
      const item = S.items.find(i=>i.id===S.selectedId);
      if(!item) return;
      const hasSecret = !!(item.secret && item.secret.trim());
      if(hasSecret){
        const guessEl = document.getElementById('secretGuess');
        const guess = normalize(guessEl.value);
        const truth = normalize(item.secret);
        const isMatch = guess.length>0 && (guess === truth || truth.includes(guess) || guess.includes(truth));
        if(!isMatch){
          S.claimError = "That doesn't match our records — double check the detail, or visit the Lost & Found desk for manual verification.";
          render();
          return;
        }
      }
      confirmClaim.disabled = true;
      try{
        await updateItemDoc(item.id, {status:'claimed'});
        if(S.lostContextId){ await updateItemDoc(S.lostContextId, {status:'claimed'}); }
        await addHistoryDoc({date: todayISO(), name: S.user.name, item: item.name, action: 'claimed'});
      }catch(e){
        console.error(e);
        showToast("Couldn't save the claim — check your connection", '⚠️');
        confirmClaim.disabled = false;
        return;
      }
      go('claimSuccess', {selectedId: item.id});
    };
  }
}

init();
</script>
</body>
</html>
